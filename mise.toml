[tools]
rust = { version = "1.100.0", components = ["clippy", "rustfmt"], targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-pc-windows-gnu"] }
node = "26"
"npm:@elgato/cli" = "1.10.5"
zig = "0.15.2"
"cargo:cargo-zigbuild" = "0.24.1"
"cargo:resvg" = "latest"

[tasks.test]
run = "cargo test"

[tasks.build]
run = [
  "cargo build --release --target aarch64-apple-darwin",
  "cargo build --release --target x86_64-apple-darwin",
  "mkdir -p su.pdx.streamdeck.mpv.sdPlugin/bin",
  "lipo -create -output su.pdx.streamdeck.mpv.sdPlugin/bin/streamdeck-mpv target/aarch64-apple-darwin/release/streamdeck-mpv target/x86_64-apple-darwin/release/streamdeck-mpv",
]

[tasks."build:windows"]
run = [
  "cargo zigbuild --release --target x86_64-pc-windows-gnu",
  "mkdir -p su.pdx.streamdeck.mpv.sdPlugin/bin",
  "cp target/x86_64-pc-windows-gnu/release/streamdeck-mpv.exe su.pdx.streamdeck.mpv.sdPlugin/bin/",
]

[tasks.validate]
depends = ["build"]
run = "streamdeck validate su.pdx.streamdeck.mpv.sdPlugin"

[tasks.link]
depends = ["build"]
run = "streamdeck link su.pdx.streamdeck.mpv.sdPlugin"

[tasks.restart]
depends = ["build"]
run = "streamdeck restart su.pdx.streamdeck.mpv"

[tasks.pack]
depends = ["build", "build:windows"]
run = "streamdeck pack su.pdx.streamdeck.mpv.sdPlugin --output dist --force"
